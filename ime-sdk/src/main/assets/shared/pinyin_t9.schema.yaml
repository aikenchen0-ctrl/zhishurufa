# 九宫与全拼共用词库，编码歧义由 Rime 的拼音图和组词器处理。
__include: luna_pinyin_simp.schema:/

schema:
  schema_id: pinyin_t9
  name: 九宫拼音
  version: "1.0"
  author:
    - Trime SDK contributors
  description: 电话九宫数字编码，复用朙月拼音词库，默认输出简体。

engine:
  # 数字先进入拼写器；省去识别器，避免宿主的数字正则截获编码。
  processors:
    - ascii_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator

speller:
  alphabet: "23456789"
  initials: "23456789"
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/

translator:
  dictionary: luna_pinyin
  prism: pinyin_t9
  enable_completion: true
  enable_sentence: true
  # 提示每个候选的实际拼音，便于区分同数字的不同读音。
  spelling_hints: 6
  preedit_format: []
  comment_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
